# ============================================================================
# AOI: Vaishno Devi — Trikuta shrine corridor (registry file)
# ----------------------------------------------------------------------------
# One file per AOI lives in config/. The root config.yaml is a one-line pointer
# (`active_config: config/<aoi>.yaml`) selecting which AOI the pipeline targets;
# any script also accepts `--config config/<aoi>.yaml` directly.
# New AOI? Copy this file, then follow docs/runbooks/NEW_AOI_PLAYBOOK.md.
# ============================================================================

# --- Area of Interest -------------------------------------------------------
# Path (relative to the project root, or absolute) to the AOI polygon.
# Must be GeoJSON in EPSG:4326. Draw it in Google Earth Pro -> Save As .kml ->
# convert to GeoJSON (geopandas/QGIS). See InSAR_hazard_forecasting_Context.md.
aoi_path: config/aoi/vaishnodevi_aoi.geojson

# Human-readable site label used in dashboard titles.
site_name: Vaishno Devi — Trikuta shrine corridor

# Site-tuned warning-tier operating points (assumed saturation m), from the
# selectivity sweep vs the GSI route inventory (§32): ALERT plateau 0.38-0.42
# (AUC 0.70), WATCH at recall 0.93. Ramban's config omits these (defaults 0.50/0.70).
operational_m: 0.40
watch_m: 0.75

# TWI-distributed saturation slope kappa (§45, Science Upgrade Plan #2): each pixel's
# saturation is m_i = clip(m + kappa*(TWI_i - TWI_mean), 0, 1) — wet convergent terrain
# saturates first. Swept vs the route inventory like m: both AOIs independently peaked at
# kappa=0.06 (VD ALERT AUC 0.707->0.757, now beats the §44 slope-only ablation; WATCH recall
# 0.913->0.957). kappa=0 reproduces the uniform-m footprint exactly.
kappa: 0.06

# LLOF downstream-flag source (§60 4c): omitted/"twi" = the historical high-TWI valley
# proxy (keeps the validated products byte-identical); "d8" = real D8 flow routing
# (flow_routing_probe criterion — the probe measured 4/14 VD flags flip). Flip to
# "d8" at the scheduled post-merge swap, then regenerate + re-score.
# ADOPTED 2026-07-25 (§67) — the post-merge swap fired (master took the merge 2026-07-19).
llof_routing: d8

# Flash-flood arm (FLOOD_EXPANSION_PLAN_2026-07-28, F0/F1). OPTIONAL: delete this block
# and the flood arm is fully OFF for this site — flood_domain.py / flood_gate.py exit 0 and
# write nothing (pinned by tests/test_flood_invariants.py R2). It adds no warning of its own
# to the validated product: the flood level is published on its own dashboard card only.
flood:
  channel_upstream_km2: 0.5   # channel definition = the validated LLOF threshold (§60 4c/§67)
  channel_buffer_m: 120       # a zone this close to a channel counts as flood-exposed
  min_catchment_coverage_pct: 95  # refuse to grade a catchment truncated by the DEM edge

# HyP3 job-name prefix. Every submitted job is named
#   "<job_name_prefix>_<DIRECTION>_path<P>_frame<F>"
# and downstream steps filter on this prefix. Use a short, unique slug per AOI.
job_name_prefix: VaishnoDevi_Trikuta

# --- Catalog search window (inclusive), ISO dates ---------------------------
# Pick the period whose ground motion matters. Here: a ~6-month pre-monsoon
# baseline from the archive through the 2026 monsoon (extend search_end and
# re-run the submitter to append pairs — it is idempotent/deduplicating).
search_start: 2026-01-01
search_end: 2026-08-08

# --- Soil shear-strength (Phase 3 infinite-slope engine) ---------------------
# Site-corroborated by the literature pass (RESULTS_AND_KPIS.md §37): Kumar &
# Anbalagan 2013 + GSI-derived overburden ranges bracket every value (soil
# φ 32–43°, c 4.9–27.5 kPa dry / 4.5–7.9 kPa saturated lows, weathering depth
# 1–3 m). Values numerically identical to Ramban's §20 calibration — kept on
# evidence, not inherited by accident. Open: primary-source confirmation of the
# overburden ranges, Trikuta γ, on-site lab (§37/§39).
soil:
  cohesion_dry_kpa: 18.5   # c' + matric-suction apparent cohesion (FS_dry)
  cohesion_wet_kpa: 5.0    # saturated effective cohesion (FS_saturated)
  phi_deg: 36.0
  gamma_kn_m3: 19.0
  depth_m: 3.0

# --- Pair-network / baseline rules ------------------------------------------
baseline:
  # Max temporal baseline (days) for a valid interferometric pair.
  max_temporal_baseline_days: 24
  # SBAS forward neighbours per scene (1 = consecutive chain; 3 = SBAS N=3).
  sbas_neighbors: 1
  # Max perpendicular baseline (m). Pairs above this risk layover / volume
  # decorrelation. ENFORCED in the connectivity-rescue gate since 2026-07-13
  # (§43): a CONCERN pair cannot become a bridge if its |Bperp| exceeds this
  # (Bperp read from the network graph's ASF cache; unknown Bperp is flagged,
  # not rejected). The submitter itself still queues all SBAS pairs.
  max_perp_baseline_m: 150

# --- Connectivity-rescue policy ---------------------------------------------
# A rescue promotes a CONCERN interferogram to KEEP so it can BRIDGE two
# otherwise-disconnected islands. A bridge is an unredundant single point of
# failure — its noise is NOT averaged out by SBAS redundancy — so it must clear
# a stricter quality bar than an ordinary KEEP pair. sbas_network_graph.py
# applies this gate and refuses to bridge a gap with any pair that fails it; the
# stack is then left disconnected (SVD / period-split downstream) rather than
# injecting noise. Tighten/loosen these per AOI using the emitted audit.
rescue_gate:
  # NOISE gates (the primary controls) — both directly govern bridge reliability:
  max_atmos_r2: 0.45      # phase-elevation R^2 ceiling (QUARANTINE line is 0.5)
  min_coherence: 0.6      # mean coherence of surviving pixels floor
  # COVERAGE sanity floor (completeness, not noise) — low by design so a sparse
  # but clean bridge is not discarded; raise toward 30 to also demand coverage.
  min_surviving_pct: 15

# Manual override ON TOP of the scientific gate: stacks to force-skip entirely
# (e.g. one you have decided to period-split regardless). Canonical labels.
# Default empty — the gate above already excludes decorrelated stacks (e.g. the
# only frame484 bridge has R^2~0.50 and is rejected automatically).
exclude_from_rescue: []

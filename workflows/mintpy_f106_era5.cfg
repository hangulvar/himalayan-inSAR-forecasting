# MintPy SBAS config — frame106 WITH ERA5 tropospheric correction (MintPy step 3).
#
# Identical to the step-2 (no-tropo) run EXCEPT the troposphericDelay block below
# (step 2 used method=no). Load files are the prep_mintpy clipped HyP3 layers on the
# custom 309x353 grid (EPSG:32643, 80 m) so MintPy and the custom inverter share an
# IDENTICAL grid for cross-validation. Paths are the /app bind-mount (always stable).
#
# RUN from a container-local /tmp work dir — the OneDrive/WSL2 bind mount cannot
# utime, which crashes MintPy's metadata-preserving copies (see error_history_log
# 2026-05-31). pyaps3 reads ~/.cdsapirc (auto-mounted) and hits the new CDS endpoint.
mintpy.load.processor      = hyp3
mintpy.load.unwFile        = /app/data/mintpy/ASC_path27_frame106/hyp3/*_unw_phase_clip.tif
mintpy.load.corFile        = /app/data/mintpy/ASC_path27_frame106/hyp3/*_corr_clip.tif
mintpy.load.connCompFile   = no
mintpy.load.demFile        = /app/data/mintpy/ASC_path27_frame106/hyp3/*_dem_clip.tif
mintpy.load.incAngleFile   = /app/data/mintpy/ASC_path27_frame106/hyp3/*_lv_theta_clip.tif
mintpy.load.azAngleFile    = /app/data/mintpy/ASC_path27_frame106/hyp3/*_lv_phi_clip.tif
mintpy.load.waterMaskFile  = /app/data/mintpy/ASC_path27_frame106/hyp3/*_water_mask_clip.tif
mintpy.compute.cluster     = no

# --- ERA5 tropospheric correction (the step-3 change) ---
mintpy.troposphericDelay.method       = pyaps
mintpy.troposphericDelay.weatherModel = ERA5
mintpy.troposphericDelay.weatherDir   = /tmp/sbas_f106_era5/weather

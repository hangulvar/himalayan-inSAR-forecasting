# MintPy SBAS config — frame106 with the EMPIRICAL height-correlation tropospheric
# correction (the topography-correlated / "power-law" family; Doin et al. 2009).
#
# This is the third arm of the tropo-method comparison (Bekaert et al. 2015, "TRAIN"):
#   * method=no              -> velocity_mintpy.tif        (step 2, no correction)
#   * method=pyaps  (ERA5)   -> velocity_mintpy_era5.tif   (step 3, weather model)
#   * method=height_correlation -> velocity_mintpy_height.tif  (THIS run, empirical)
# Identical load block + grid (309x353, EPSG:32643, 80 m) so all three share the SAME
# pixels and are directly comparable against the custom inverter. No external data is
# needed (unlike ERA5/GACOS): MintPy estimates the phase-elevation relationship from the
# interferograms + the DEM and removes the stratified (topo-correlated) component.
#
# RUN from a container-local /tmp work dir — the OneDrive/WSL2 bind mount cannot utime,
# which crashes MintPy's metadata-preserving copies (see error_history_log 2026-05-31).
mintpy.load.processor      = hyp3
mintpy.load.unwFile        = /app/data/mintpy/ASC_path27_frame106/hyp3/*_unw_phase_clip.tif
mintpy.load.corFile        = /app/data/mintpy/ASC_path27_frame106/hyp3/*_corr_clip.tif
mintpy.load.connCompFile   = no
mintpy.load.demFile        = /app/data/mintpy/ASC_path27_frame106/hyp3/*_dem_clip.tif
mintpy.load.incAngleFile   = /app/data/mintpy/ASC_path27_frame106/hyp3/*_lv_theta_clip.tif
mintpy.load.azAngleFile    = /app/data/mintpy/ASC_path27_frame106/hyp3/*_lv_phi_clip.tif
mintpy.load.waterMaskFile  = /app/data/mintpy/ASC_path27_frame106/hyp3/*_water_mask_clip.tif
mintpy.compute.cluster     = no

# --- Empirical (height-correlation) tropospheric correction (Doin et al. 2009) ---
# Estimates a linear phase-vs-elevation ratio per acquisition and subtracts the
# stratified component. No weather model / no download.
mintpy.troposphericDelay.method         = height_correlation
mintpy.troposphericDelay.minCorrelation  = 0.2

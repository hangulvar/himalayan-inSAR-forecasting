name: insar_qa_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal=3.13.*
  - rasterio
  - geopandas
  - shapely
  - pyproj
  - numpy
  - scipy
  - matplotlib-base
  - python-dotenv  # Added this dependency based on the code
  - pyyaml         # config.yaml loader (workflows/config.py)
  - h5py
  - pdfplumber     # GSI inventory PDF tables (ingest_gsi_inventory.py)
  - pip
  - pip:
    - hyp3_sdk     # ASF's cloud processing submission API
    - asf_search   # ASF's catalog querying API
    - earthengine-api  # GEE rainfall fetchers (fetch_chirps.py, fetch_gpm_imerg.py)

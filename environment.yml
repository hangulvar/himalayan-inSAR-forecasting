name: himalayas-geospatial
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  
  # Core Data Science
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  
  # Core Geospatial Stack
  - shapely
  - pyproj
  - fiona
  - rasterio
  - geopandas
  - xarray
  - rioxarray
  
  # Geospatial Analysis & Helpers
  - mapclassify
  - contextily
  - pydeck
  - folium
  - leafmap
  - rtree
  
  # Data Access & APIs
  - earthaccess
  - sentinelsat
  - python-dotenv
  - requests
  - h5py
  - netcdf4
  - hyp3_sdk
  
  # Jupyter & Interface
  - jupyterlab
  - ipywidgets
  
  # Pip installations (for libraries that might not be on conda-forge or best installed via pip)
  - pip:
      - earthengine-api
      - odc-geo
